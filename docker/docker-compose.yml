# ══════════════════════════════════════════════════════════════════════════════
# Télémédecine Sécurisée — Docker Compose
# ══════════════════════════════════════════════════════════════════════════════
# Usage : docker compose -f docker/docker-compose.yml up -d
# ══════════════════════════════════════════════════════════════════════════════

services:
  # ── Application FastAPI ──────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: telemedecine-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://telemedecine:${DB_PASSWORD:-securepassword}@db:5432/telemedecine
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend
      - backend
    volumes:
      - app-logs:/app/logs
      - app-tmp:/app/tmp
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100M

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: telemedecine-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: telemedecine
      POSTGRES_USER: telemedecine
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemedecine -d telemedecine"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    command: >
      postgres
        -c ssl=off
        -c log_connections=on
        -c log_disconnections=on
        -c log_statement=ddl
        -c log_duration=on
        -c shared_preload_libraries=pg_stat_statements

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: telemedecine-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    command: >
      redis-server
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --requirepass ${REDIS_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true

  # ── Prometheus — Monitoring ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: telemedecine-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend
      - frontend
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ── Grafana — Visualisation ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: telemedecine-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - backend
      - frontend
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

# ── Réseaux ──────────────────────────────────────────────────────────────────
networks:
  frontend:
    name: telemedecine-frontend
    driver: bridge
  backend:
    name: telemedecine-backend
    driver: bridge
    internal: true

# ── Volumes persistants ──────────────────────────────────────────────────────
volumes:
  postgres-data:
    name: telemedecine-postgres-data
  redis-data:
    name: telemedecine-redis-data
  prometheus-data:
    name: telemedecine-prometheus-data
  grafana-data:
    name: telemedecine-grafana-data
  app-logs:
    name: telemedecine-app-logs
  app-tmp:
    name: telemedecine-app-tmp
