# ══════════════════════════════════════════════════════════════════════════════
# Télémédecine Sécurisée — Security Audit Pipeline
# ══════════════════════════════════════════════════════════════════════════════
# Exécuté chaque semaine (lundi 6h00 UTC) et sur push main
# ══════════════════════════════════════════════════════════════════════════════

name: Security Audit

on:
  schedule:
    # Chaque lundi à 06:00 UTC
    - cron: "0 6 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Audit des dépendances ───────────────────────────────────────────────
  dependency-audit:
    name: "📦 Audit des dépendances"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installation des outils d'audit
        run: |
          python -m pip install --upgrade pip
          pip install safety pip-audit

      - name: Safety — Scan des vulnérabilités connues
        run: |
          echo "🔍 Scan des dépendances de base..."
          safety check --file requirements/base.txt --output json > safety-base.json || true

          echo "🔍 Scan des dépendances de production..."
          safety check --file requirements/prod.txt --output json > safety-prod.json || true

      - name: pip-audit — Audit complet
        run: |
          pip install -r requirements/base.txt
          pip-audit --format json --output pip-audit-report.json || true

      - name: Upload des rapports d'audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-reports
          path: |
            safety-base.json
            safety-prod.json
            pip-audit-report.json
          retention-days: 90

  # ── Scan des conteneurs ─────────────────────────────────────────────────
  container-scan:
    name: "🐳 Scan des conteneurs"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image pour scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: telemedecine-securisee:scan

      - name: Trivy — Scan de l'image Docker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: telemedecine-securisee:scan
          format: sarif
          output: trivy-container.sarif
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: 0

      - name: Upload résultats Trivy vers GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-container.sarif
          category: trivy-container

      - name: Trivy — Rapport lisible
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: telemedecine-securisee:scan
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: 0

  # ── Analyse statique de sécurité (SAST) ────────────────────────────────
  sast:
    name: "🔐 Analyse SAST"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installation des outils SAST
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[toml]>=1.8.0"

      - name: Bandit — Analyse de sécurité Python
        run: |
          # Rapport JSON pour archivage
          python -m bandit -r src/ -c pyproject.toml -f json -o bandit-report.json || true

          # Rapport SARIF pour GitHub Security
          python -m bandit -r src/ -c pyproject.toml -f sarif -o bandit-report.sarif || true

          # Rapport lisible dans les logs
          python -m bandit -r src/ -c pyproject.toml -f txt || true

      - name: Upload résultats Bandit vers GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-report.sarif
          category: bandit

      - name: Semgrep — Analyse SAST avancée
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/security-audit
            p/owasp-top-ten
            p/django
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Upload des rapports SAST
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            bandit-report.json
            bandit-report.sarif
          retention-days: 90
