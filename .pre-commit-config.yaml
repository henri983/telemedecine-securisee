# ══════════════════════════════════════════════════════════════════════════════
# Télémédecine Sécurisée — Pre-commit Hooks
# ══════════════════════════════════════════════════════════════════════════════
# Installation : pre-commit install
# Exécution manuelle : pre-commit run --all-files
# ══════════════════════════════════════════════════════════════════════════════

repos:
  # ── Hooks généraux ────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: "Supprimer les espaces en fin de ligne"
      - id: end-of-file-fixer
        name: "Assurer un retour à la ligne en fin de fichier"
      - id: check-yaml
        name: "Valider la syntaxe YAML"
        args: [--allow-multiple-documents]
      - id: check-json
        name: "Valider la syntaxe JSON"
      - id: check-added-large-files
        name: "Bloquer les gros fichiers (>500KB)"
        args: [--maxkb=500]
      - id: detect-private-key
        name: "Détecter les clés privées commitées"
      - id: check-merge-conflict
        name: "Détecter les conflits de merge non résolus"
      - id: check-case-conflict
        name: "Détecter les conflits de casse de fichiers"

  # ── Ruff — Linting et formatage Python ────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
        name: "Ruff — Lint Python"
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: "Ruff — Format Python"
        types_or: [python, pyi, jupyter]

  # ── Bandit — Analyse de sécurité ──────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        name: "Bandit — Analyse de sécurité Python"
        args: [-c, pyproject.toml, -r, src/]
        additional_dependencies: ["bandit[toml]"]
        pass_filenames: false

  # ── MyPy — Vérification de types ──────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: "MyPy — Vérification de types"
        additional_dependencies:
          - pydantic>=2.10.0
          - types-passlib
          - types-python-jose
        args: [--config-file=pyproject.toml]
        pass_filenames: false
